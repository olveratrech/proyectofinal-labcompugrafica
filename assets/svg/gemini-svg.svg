<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo de la tarjeta -->
  <rect width="1000" height="600" fill="#FFFFFF" rx="16" />
  <rect x="4" y="4" width="992" height="592" fill="none" stroke="#E5E7EB" stroke-width="4" rx="12" />

  <!-- Encabezado -->
  <rect x="0" y="0" width="1000" height="120" fill="#0F172A" rx="16" />
  <text x="60" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF">Experimento 01: Ley de Hooke</text>
  <text x="60" y="150" font-family="sans-serif" font-size="24" font-weight="bold" fill="#3B82F6">MECÁNICA CLÁSICA • ELASTICIDAD</text>

  <!-- Caja de la fórmula -->
  <rect x="60" y="190" width="550" height="140" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" rx="12" />
  <text x="335" y="275" font-family="serif" font-size="64" font-style="italic" font-weight="bold" fill="#0F172A" text-anchor="middle">F = -k · x</text>

  <!-- Explicación de variables -->
  <text x="60" y="400" font-family="sans-serif" font-size="24" font-weight="bold" fill="#0F172A">Variables:</text>
  <text x="60" y="450" font-family="sans-serif" font-size="24" fill="#475569"><tspan font-weight="bold" fill="#EF4444">F</tspan> = Fuerza elástica restauradora (N)</text>
  <text x="60" y="490" font-family="sans-serif" font-size="24" fill="#475569"><tspan font-weight="bold" fill="#10B981">k</tspan> = Constante de rigidez del resorte (N/m)</text>
  <text x="60" y="530" font-family="sans-serif" font-size="24" fill="#475569"><tspan font-weight="bold" fill="#3B82F6">x</tspan> = Desplazamiento desde el equilibrio (m)</text>

  <!-- Gráfico vectorial del resorte (Lado derecho) -->
  <!-- Techo -->
  <line x1="720" y1="190" x2="880" y2="190" stroke="#0F172A" stroke-width="8" stroke-linecap="round" />
  <!-- Base fija -->
  <line x1="800" y1="190" x2="800" y2="230" stroke="#64748B" stroke-width="6" />
  <!-- Resorte (Zig-Zag) -->
  <path d="M800,230 L840,250 L760,290 L840,330 L760,370 L840,410 L760,450 L800,470" stroke="#3B82F6" stroke-width="8" fill="none" stroke-linejoin="round" />
  <!-- Gancho inferior -->
  <line x1="800" y1="470" x2="800" y2="500" stroke="#64748B" stroke-width="6" />
  <!-- Masa -->
  <rect x="750" y="500" width="100" height="60" fill="#EF4444" rx="8" />
  <text x="800" y="540" font-family="sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">m</text>
</svg>