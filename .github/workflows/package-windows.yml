name: Empaquetar Windows x64

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = "C:\vcpkg"
          if (-not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
            & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Instalar dependencias x64
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            glew:x64-windows `
            glfw3:x64-windows `
            glm:x64-windows `
            assimp:x64-windows

      - name: Compilar y empaquetar RenderLab
        shell: pwsh
        run: |
          & .\tools\package_windows.ps1 `
            -VcpkgRoot $env:VCPKG_ROOT `
            -Generator "Visual Studio 17 2022"

      - name: Publicar paquete portable
        uses: actions/upload-artifact@v4
        with:
          name: RenderLab-windows-x64
          path: dist/RenderLab-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
